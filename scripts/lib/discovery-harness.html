<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deep Discovery status harness</title>
<style>
  :root { color-scheme: light dark; --fg: #1b1a16; --bg: #f6f4ee; --line: #6b675c; --accent: #8a5a00; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f3efe6; --bg: #090b0d; --line: #7a828b; --accent: #d6a84b; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  h1 { font-size: 1.3rem; } h2, h3 { font-size: 1.05rem; }
  button { min-height: 44px; min-width: 44px; padding: 0 14px; background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; font: inherit; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  table { border-collapse: collapse; width: 100%; } th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  caption { text-align: left; font-weight: 700; padding: 6px 0; }
  .scroll { overflow-x: auto; max-width: 100%; }
  .dc-stats { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; } .dc-stats dd { margin: 0; }
  @media (max-width: 480px) { .dc-stats { grid-template-columns: 1fr; } .dc-stats dd { margin-bottom: 6px; } }
  progress { width: 60%; max-width: 360px; }
  dt { font-weight: 700; } dd { margin: 0 0 8px; }
</style>
</head>
<body>
<a href="#main" class="skip">Skip to content</a>
<main id="main">
  <h1>Deep Discovery status harness</h1>
  <p>Test page: runs the engine against this same site and shows the progress, coverage and request log.</p>
  <p><button type="button" id="start">Start a run</button></p>
  <div id="progress"></div>
  <section id="results" hidden aria-labelledby="results-h">
    <h2 id="results-h">Results</h2>
    <p id="summary" role="status"></p>
    <div id="coverage"></div>
    <h3>What the result words mean</h3>
    <div id="legend"></div>
    <h3>Request log</h3>
    <div class="scroll" tabindex="0" role="region" aria-label="Request log (scrolls sideways on small screens)" id="ledger"></div>
  </section>
</main>
<script type="module">
  import { DiscoveryRun, DailyBudget } from '/__m/engine.js';
  import { createFetchApiFetcher } from '/__m/fetchers.js';
  import { mountProgress, ledgerHtml, outcomeLegendHtml } from '/__m/report.js';
  import { coverageHtml } from '/__m/ledger.js';

  const ui = mountProgress(document.querySelector('#progress'), {
    onPause: () => window.__run && window.__run.pause(),
    onResume: () => window.__run && window.__run.resume(),
    onCancel: () => window.__run && window.__run.cancel()
  });
  ui.update({ state: 'idle', message: 'No run yet. Choose "Start a run".', pagesFetched: 0, pagesPlanned: 0, pagesRemaining: 0, requests: 0, requestsMax: 0, bytes: 0, etaMs: 0 });
  window.__events = [];
  document.querySelector('#start').addEventListener('click', async () => {
    const params = new URLSearchParams(location.search);
    const host = location.hostname, hp = location.host;
    const fetcher = createFetchApiFetcher({ manualRedirects: false });   // browser style: the browser follows redirects, the engine checks the final address
    const run = new DiscoveryRun({
      seeds: [location.origin + '/'], mode: 'extension', fetcher, guardOptions: { allowPrivateHosts: [hp] }, termsAcknowledged: [host],
      limits: { minDelayMs: 0, maxPages: Number(params.get('pages') || 6) }, budget: new DailyBudget(),
      onProgress: (p) => { ui.update(p); window.__events.push({ state: p.state, message: p.message }); }
    });
    window.__run = run;
    const result = await run.start();
    ui.update(run.progress());
    document.querySelector('#results').hidden = false;
    document.querySelector('#summary').textContent = result.message;
    document.querySelector('#coverage').innerHTML = coverageHtml(result.coverage);
    document.querySelector('#legend').innerHTML = outcomeLegendHtml();
    document.querySelector('#ledger').innerHTML = ledgerHtml(result.ledger);
    window.__result = result;
  });
</script>
</body>
</html>
